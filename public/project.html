<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyWork · 개인 업무 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body data-view="project">
<div class="app">
  <aside>
    <div class="brand"><b>MyWork</b></div>
    <nav id="nav"></nav>
    <div style="flex:1"></div>
    <div class="cats"><h6>업무분류</h6><div id="sidebar-cats" style="display:flex;flex-direction:column;gap:0"></div></div>
  </aside>
  <main>
    <header>
      <div class="vtitle" id="view-title"></div>
      <div class="grow"></div>
      <input id="q" placeholder="태스크 검색">
      <select id="f-category"></select>
      <button class="toggle" id="hide-done" title="완료된 태스크를 목록·보드·캘린더에서 감춥니다">완료 숨김</button>
      <button class="toggle" id="open-archive" title="오래된 완료 태스크를 보관하거나 복원합니다">정리</button>
      <button class="toggle" id="open-settings" title="진행상황·업무분류를 관리합니다">설정</button>
      <button class="toggle" id="open-ai" title="자연어로 지시하면 AI가 태스크·메모를 대신 처리합니다 (단축키: i)">AI 지시</button>
      <button class="btn-primary" id="new-task">＋ 새 태스크</button>
    </header>
    <div id="viewport"></div>
  </main>
</div>
<div id="modal-root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
